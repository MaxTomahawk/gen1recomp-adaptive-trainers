name: Release acceptance Task 12

on:
  push:
    branches: ["agent/release-0.1.0-prep"]
    paths: [".github/workflows/release-acceptance-task12.yml"]

permissions:
  contents: read

jobs:
  released-engine-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Adaptive Trainers
        uses: actions/checkout@v7

      - name: Check out exact Gen1Recomp v0.2.25 release
        uses: actions/checkout@v7
        with:
          repository: bryanthaboi/gen1recomp
          ref: 08121faa3dd01ba68bb6bb74676650c5ebe1d116
          path: .engine/gen1recomp
          fetch-depth: 1

      - name: Install ROM-free test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes luajit lua5.1 luarocks python3-pil
          sudo luarocks --lua-version=5.1 install luacheck
          luacheck --version

      - name: Verify exact engine release SHA
        run: |
          test "$(git -C .engine/gen1recomp rev-parse HEAD)" = "08121faa3dd01ba68bb6bb74676650c5ebe1d116"

      - name: Run released-engine lint gate
        working-directory: .engine/gen1recomp
        run: ./scripts/lint.sh --gate

      - name: Run released-engine full lint report
        working-directory: .engine/gen1recomp
        run: ./scripts/lint.sh

      - name: Run released-engine ROM-free regression suite
        working-directory: .engine/gen1recomp
        run: ./scripts/test.sh

      - name: Run full Adaptive Trainers released-engine gate
        env:
          GEN1RECOMP_ROOT: ${{ github.workspace }}/.engine/gen1recomp
        run: ./scripts/check.sh

      - name: Run reproducible Adaptive Trainers release package gate
        env:
          GEN1RECOMP_ROOT: ${{ github.workspace }}/.engine/gen1recomp
          SOURCE_DATE_EPOCH: "0"
        run: ./scripts/package.sh

      - name: Verify patch hygiene
        run: git diff --check
