name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine:
          - name: release-0.2.25
            repository: bryanthaboi/gen1recomp
            ref: 08121faa3dd01ba68bb6bb74676650c5ebe1d116
    steps:
      - name: Check out Adaptive Trainers
        uses: actions/checkout@v7

      - name: Check out audited Gen1Recomp release
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.engine.repository }}
          ref: ${{ matrix.engine.ref }}
          path: .engine/gen1recomp

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install --yes luajit

      - name: Verify command diagnostics
        run: bash tests/tooling/check_script_spec.sh

      - name: Verify pack helper rejects overwrite targets
        env:
          GEN1RECOMP_ROOT: ${{ github.workspace }}/.engine/gen1recomp
        run: bash tests/tooling/package_helper_spec.sh

      - name: Verify failed package gate is fail-closed
        env:
          GEN1RECOMP_ROOT: ${{ github.workspace }}/.engine/gen1recomp
        run: bash tests/tooling/package_failure_spec.sh

      - name: Build reproducible ROM-free package
        env:
          GEN1RECOMP_ROOT: ${{ github.workspace }}/.engine/gen1recomp
          SOURCE_DATE_EPOCH: "0"
        run: bash scripts/package.sh

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: adaptive_trainers-development-${{ matrix.engine.name }}
          path: dist/*.zip
