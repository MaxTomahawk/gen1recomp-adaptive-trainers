name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine:
          - name: upstream-dev
            repository: bryanthaboi/gen1recomp
            ref: e88f2ef060cb8bd1d45d53a6aaa46f997f308791
          - name: developer-mode-seam
            repository: MaxTomahawk/gen1recomp
            ref: 333949ce0d1a739209c0ea51b3063339287d9a3b
    steps:
      - name: Check out Adaptive Trainers
        uses: actions/checkout@v7

      - name: Check out current audited Gen1Recomp dev
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.engine.repository }}
          ref: ${{ matrix.engine.ref }}
          path: .engine/gen1recomp

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install --yes luajit

      - name: Verify command diagnostics
        run: bash tests/tooling/check_script_spec.sh

      - name: Verify pack helper rejects overwrite targets
        env:
          GEN1RECOMP_ROOT: ${{ github.workspace }}/.engine/gen1recomp
        run: bash tests/tooling/package_helper_spec.sh

      - name: Verify failed package gate is fail-closed
        env:
          GEN1RECOMP_ROOT: ${{ github.workspace }}/.engine/gen1recomp
        run: bash tests/tooling/package_failure_spec.sh

      - name: Test, validate, and lint
        env:
          GEN1RECOMP_ROOT: ${{ github.workspace }}/.engine/gen1recomp
        run: bash scripts/check.sh

      - name: Build reproducible ROM-free package
        env:
          GEN1RECOMP_ROOT: ${{ github.workspace }}/.engine/gen1recomp
          SOURCE_DATE_EPOCH: "0"
        run: bash scripts/package.sh

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: adaptive_trainers-development-${{ matrix.engine.name }}
          path: dist/*.modpkg
