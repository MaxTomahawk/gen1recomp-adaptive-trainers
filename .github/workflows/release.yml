name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out audited Gen1Recomp release
        uses: actions/checkout@v7
        with:
          repository: bryanthaboi/gen1recomp
          ref: 08121faa3dd01ba68bb6bb74676650c5ebe1d116
          path: .engine/gen1recomp

      - name: Install release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes luajit python3-pil

      - name: Verify tag matches manifest version
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          MANIFEST_VERSION=$(python3 - <<'PY'
          import json
          with open("manifest.json", encoding="utf-8") as handle:
              print(json.load(handle)["version"])
          PY
          )
          if [[ "$TAG" != "v$VERSION" || "$VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "manifest version $MANIFEST_VERSION does not match release tag $TAG" >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify release workflow contract
        run: bash tests/tooling/release_workflow_spec.sh

      - name: Build and verify reproducible release package
        env:
          GEN1RECOMP_ROOT: ${{ github.workspace }}/.engine/gen1recomp
          SOURCE_DATE_EPOCH: "0"
        run: bash scripts/package.sh

      - name: Verify release asset and checksum
        shell: bash
        run: |
          set -euo pipefail
          ASSET="dist/adaptive_trainers-${VERSION}.zip"
          test -f "$ASSET"
          unzip -p "$ASSET" manifest.json > "$RUNNER_TEMP/manifest.json"
          python3 - "$RUNNER_TEMP/manifest.json" "$VERSION" <<'PY'
          import json, sys
          path, expected = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              actual = json.load(handle)["version"]
          if actual != expected:
              raise SystemExit(f"packed manifest version {actual} != {expected}")
          PY
          (cd dist && sha256sum "adaptive_trainers-${VERSION}.zip" > sha256sums.txt)
          cat dist/sha256sums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<NOTES
          Adaptive Trainers ${VERSION} for Pokémon Red, Blue, and Yellow.

          Requires Gen1Recomp >=0.2.25 <1.0.0. Optional Kanto+ activates only when a compatible Gold dataset has been imported and otherwise fails closed to Kanto-only behavior.

          Download `adaptive_trainers-${VERSION}.zip` and install it through **MODS > Import mod .zip**.
          NOTES
          gh release create "$TAG" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "dist/adaptive_trainers-${VERSION}.zip" \
            "dist/sha256sums.txt"
